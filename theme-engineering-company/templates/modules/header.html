<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header" id="siteHeader">
  <!-- Top Info Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-content">
        <div class="top-bar-left">
          <span class="top-bar-item">
            <i class="icon-phone"></i>
            <span th:text="${theme.config.contact.phone} ?: '400-XXX-XXXX'">400-XXX-XXXX</span>
          </span>
          <span class="top-bar-item">
            <i class="icon-email"></i>
            <span th:text="${theme.config.contact.email} ?: 'info@example.com'">info@example.com</span>
          </span>
        </div>
        <div class="top-bar-right">
          <span class="top-bar-item">
            <i class="icon-clock"></i>
            <span th:text="${theme.config.contact.working_hours} ?: '周一至周五 8:30-17:30'">周一至周五 8:30-17:30</span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Navigation -->
  <nav class="main-nav" id="mainNav">
    <div class="container">
      <div class="nav-content">
        <!-- Logo -->
        <a href="/" class="nav-logo">
          <img th:if="${theme.config.basic.logo_url != null and theme.config.basic.logo_url != ''}"
               th:src="${theme.config.basic.logo_url}"
               alt="Logo" class="logo-image" />
          <span class="logo-text" th:text="${theme.config.basic.site_title} ?: '虹远水利工程有限公司'">虹远水利工程有限公司</span>
        </a>

        <!-- Desktop Menu -->
        <ul class="nav-menu" id="navMenu">
          <li class="nav-item">
            <a href="/" class="nav-link" data-page="home">首页</a>
          </li>
          <li class="nav-item">
            <a href="/about" class="nav-link" data-page="about">关于我们</a>
          </li>
          <li class="nav-item">
            <a href="/business" class="nav-link" data-page="business">业务领域</a>
          </li>
          <li class="nav-item">
            <a href="/cases" class="nav-link" data-page="cases">工程案例</a>
          </li>
          <li class="nav-item">
            <a href="/archives" class="nav-link" data-page="archives">新闻中心</a>
          </li>
          <li class="nav-item">
            <a href="/contact" class="nav-link" data-page="contact">联系我们</a>
          </li>
          <!-- Dynamic menu items from Halo -->
          <li class="nav-item" th:each="menuItem : ${menuItems}" th:if="${menuItems != null}">
            <a th:href="${menuItem.status.href}" th:text="${menuItem.status.displayName}" class="nav-link"></a>
          </li>
        </ul>

        <!-- Mobile Menu Toggle -->
        <button class="nav-toggle" id="navToggle" aria-label="切换导航菜单">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>
  </nav>
</header>
</body>
</html>

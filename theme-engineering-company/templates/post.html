<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" th:content="${theme.config.seo.keywords}" />
  <meta name="description" th:content="${post.status.excerpt}" />
  <title th:text="${post.spec.title} + ' - ' + (${theme.config.basic.site_title} ?: '虹远水利工程有限公司')">文章标题</title>
  <link rel="icon" th:href="${theme.config.basic.favicon_url}" th:if="${theme.config.basic.favicon_url != null and theme.config.basic.favicon_url != ''}" />
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
</head>
<body class="page-post">

  <!-- Header -->
  <th:block th:replace="modules/header :: header"></th:block>

  <!-- Page Banner -->
  <section class="page-banner">
    <div class="page-banner-overlay"></div>
    <div class="container">
      <h1 class="page-banner-title">新闻详情</h1>
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="面包屑导航">
        <a href="/" class="breadcrumb-item">首页</a>
        <span class="breadcrumb-separator">&gt;</span>
        <a href="/archives" class="breadcrumb-item">新闻中心</a>
        <span class="breadcrumb-separator">&gt;</span>
        <span class="breadcrumb-item active" th:text="${post.spec.title}">文章标题</span>
      </nav>
    </div>
  </section>

  <!-- Article Content -->
  <section class="section post-content-section">
    <div class="container">
      <div class="post-wrapper">
        <article class="post-content">
          <!-- Article Header -->
          <header class="post-header">
            <h1 class="post-title" th:text="${post.spec.title}">文章标题</h1>
            <div class="post-meta">
              <span class="meta-item meta-date">
                <span class="meta-icon">&#128197;</span>
                <time th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}">2024-01-01</time>
              </span>
              <span class="meta-item meta-category" th:if="${post.categories != null and !post.categories.isEmpty()}">
                <span class="meta-icon">&#128194;</span>
                <span th:each="category : ${post.categories}">
                  <a th:href="@{'/categories/' + ${category.metadata.name}}" th:text="${category.spec.displayName}">分类</a>
                </span>
              </span>
              <span class="meta-item meta-views" th:if="${post.stats != null}">
                <span class="meta-icon">&#128065;</span>
                <span th:text="${post.stats.visit} ?: '0'">0</span> 阅读
              </span>
            </div>
          </header>

          <!-- Article Body -->
          <div class="post-body article-content" th:utext="${post.content.content}">
            <p>文章正文内容将在此处显示</p>
          </div>

          <!-- Tags -->
          <div class="post-tags" th:if="${post.tags != null and !post.tags.isEmpty()}">
            <span class="tags-label">标签：</span>
            <a th:each="tag : ${post.tags}"
               th:href="@{'/tags/' + ${tag.metadata.name}}"
               th:text="${tag.spec.displayName}"
               class="tag-item">标签</a>
          </div>
        </article>

        <!-- Prev / Next Navigation -->
        <nav class="post-navigation">
          <div class="post-nav-item post-nav-prev" th:if="${prevPost != null}">
            <span class="nav-label">上一篇</span>
            <a th:href="@{'/archives/' + ${prevPost.metadata.name}}" th:text="${prevPost.spec.title}" class="nav-title">上一篇文章标题</a>
          </div>
          <div class="post-nav-item post-nav-next" th:if="${nextPost != null}">
            <span class="nav-label">下一篇</span>
            <a th:href="@{'/archives/' + ${nextPost.metadata.name}}" th:text="${nextPost.spec.title}" class="nav-title">下一篇文章标题</a>
          </div>
        </nav>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <th:block th:replace="modules/footer :: footer"></th:block>

  <!-- JavaScript -->
  <script th:src="@{/assets/js/main.js}"></script>
</body>
</html>

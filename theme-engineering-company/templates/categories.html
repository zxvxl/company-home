<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" th:content="${theme.config.seo.keywords}" />
  <meta name="description" content="新闻分类" />
  <title th:text="'新闻分类 - ' + (${theme.config.basic.site_title} ?: '虹远水利工程有限公司')">新闻分类</title>
  <link rel="icon" th:href="${theme.config.basic.favicon_url}" th:if="${theme.config.basic.favicon_url != null and theme.config.basic.favicon_url != ''}" />
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
</head>
<body class="page-categories">

  <!-- Header -->
  <th:block th:replace="modules/header :: header"></th:block>

  <!-- Page Banner -->
  <section class="page-banner">
    <div class="page-banner-overlay"></div>
    <div class="container">
      <h1 class="page-banner-title">新闻分类</h1>
      <nav class="breadcrumb" aria-label="面包屑导航">
        <a href="/" class="breadcrumb-item">首页</a>
        <span class="breadcrumb-separator">&gt;</span>
        <span class="breadcrumb-item active">新闻分类</span>
      </nav>
    </div>
  </section>

  <!-- Categories Content -->
  <section class="section categories-section">
    <div class="container">
      <div class="categories-grid">
        <a th:each="category : ${categories}"
           th:href="@{'/categories/' + ${category.metadata.name}}"
           class="category-card">
          <div class="category-icon">
            <span>&#128194;</span>
          </div>
          <h3 class="category-name" th:text="${category.spec.displayName}">分类名称</h3>
          <span class="category-count" th:if="${category.status != null}">
            <span th:text="${category.status.postCount} ?: '0'">0</span> 篇文章
          </span>
        </a>
      </div>

      <!-- Empty State -->
      <div class="archive-empty" th:if="${categories == null or categories.isEmpty()}">
        <p>暂无分类，请在后台创建文章分类。</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <th:block th:replace="modules/footer :: footer"></th:block>

  <!-- JavaScript -->
  <script th:src="@{/assets/js/main.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" th:content="${theme.config.seo.keywords}" />
  <meta name="description" content="标签云" />
  <title th:text="'标签云 - ' + (${theme.config.basic.site_title} ?: '虹远水利工程有限公司')">标签云</title>
  <link rel="icon" th:href="${theme.config.basic.favicon_url}" th:if="${theme.config.basic.favicon_url != null and theme.config.basic.favicon_url != ''}" />
  <link rel="stylesheet" th:href="@{/assets/css/style.css}" />
</head>
<body class="page-tags">

  <!-- Header -->
  <th:block th:replace="modules/header :: header"></th:block>

  <!-- Page Banner -->
  <section class="page-banner">
    <div class="page-banner-overlay"></div>
    <div class="container">
      <h1 class="page-banner-title">标签云</h1>
      <nav class="breadcrumb" aria-label="面包屑导航">
        <a href="/" class="breadcrumb-item">首页</a>
        <span class="breadcrumb-separator">&gt;</span>
        <span class="breadcrumb-item active">标签云</span>
      </nav>
    </div>
  </section>

  <!-- Tags Content -->
  <section class="section tags-section">
    <div class="container">
      <div class="tag-cloud">
        <a th:each="tag : ${tags}"
           th:href="@{'/tags/' + ${tag.metadata.name}}"
           th:text="${tag.spec.displayName}"
           th:classappend="'tag-size-' + ${(tag.status.postCount ?: 1) > 10 ? 'xl' : (tag.status.postCount ?: 1) > 5 ? 'lg' : (tag.status.postCount ?: 1) > 2 ? 'md' : 'sm'}"
           class="tag-cloud-item">标签</a>
      </div>

      <!-- Empty State -->
      <div class="archive-empty" th:if="${tags == null or tags.isEmpty()}">
        <p>暂无标签，请在后台为文章添加标签。</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <th:block th:replace="modules/footer :: footer"></th:block>

  <!-- JavaScript -->
  <script th:src="@{/assets/js/main.js}"></script>
</body>
</html>

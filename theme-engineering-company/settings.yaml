apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-engineering-company-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: text
          name: site_title
          label: 公司名称
          value: 虹远水利工程有限公司
          validation: required
        - $formkit: text
          name: logo_url
          label: Logo地址
          value: ""
          help: 请输入Logo图片的URL地址
        - $formkit: text
          name: favicon_url
          label: Favicon地址
          value: ""
          help: 请输入网站图标的URL地址
        - $formkit: text
          name: slogan
          label: 公司标语
          value: 专注水利 造福民生
        - $formkit: text
          name: icp_number
          label: ICP备案号
          value: ""
          help: 例如：京ICP备XXXXXXXX号

    - group: contact
      label: 联系方式
      formSchema:
        - $formkit: text
          name: address
          label: 公司地址
          value: ""
        - $formkit: text
          name: phone
          label: 联系电话
          value: 400-XXX-XXXX
        - $formkit: text
          name: email
          label: 电子邮箱
          value: info@example.com
        - $formkit: text
          name: fax
          label: 传真号码
          value: ""
        - $formkit: text
          name: wechat_qr
          label: 微信二维码图片地址
          value: ""
          help: 请输入微信公众号二维码图片的URL
        - $formkit: text
          name: working_hours
          label: 工作时间
          value: 周一至周五 8:30-17:30

    - group: homepage
      label: 首页设置
      formSchema:
        - $formkit: text
          name: banner1_image
          label: Banner图片1
          value: ""
        - $formkit: text
          name: banner1_title
          label: Banner标题1
          value: 专注水利 造福民生
        - $formkit: text
          name: banner1_subtitle
          label: Banner副标题1
          value: 二十年专业水利工程建设经验
        - $formkit: text
          name: banner2_image
          label: Banner图片2
          value: ""
        - $formkit: text
          name: banner2_title
          label: Banner标题2
          value: 科技兴水 品质为先
        - $formkit: text
          name: banner2_subtitle
          label: Banner副标题2
          value: 引领水利工程技术创新发展
        - $formkit: text
          name: banner3_image
          label: Banner图片3
          value: ""
        - $formkit: text
          name: banner3_title
          label: Banner标题3
          value: 二十年匠心 筑水利丰碑
        - $formkit: text
          name: banner3_subtitle
          label: Banner副标题3
          value: 值得信赖的水利工程综合服务商
        - $formkit: text
          name: stat_projects
          label: 完工项目数量
          value: "500"
        - $formkit: text
          name: stat_years
          label: 服务年限
          value: "20"
        - $formkit: text
          name: stat_team
          label: 团队规模
          value: "300"
        - $formkit: text
          name: stat_clients
          label: 合作客户数量
          value: "200"
        - $formkit: checkbox
          name: show_partners
          label: 显示合作伙伴区域
          value: true

    - group: seo
      label: SEO设置
      formSchema:
        - $formkit: text
          name: keywords
          label: 网站关键词
          value: 水利工程,水库大坝,河道治理,农田灌溉,防洪排涝,水土保持,供水工程
          help: 多个关键词用逗号分隔
        - $formkit: textarea
          name: description
          label: 网站描述
          value: 虹远水利工程有限公司专注水利工程建设二十余年，业务涵盖水库大坝、河道治理、农田灌溉、防洪排涝、水土保持及供水工程。
        - $formkit: textarea
          name: analytics_code
          label: 统计分析代码
          value: ""
          help: 请粘贴百度统计或Google Analytics等第三方统计代码

    - group: social
      label: 社交媒体
      formSchema:
        - $formkit: text
          name: wechat
          label: 微信公众号
          value: ""
          help: 微信公众号名称或ID
        - $formkit: text
          name: weibo
          label: 微博链接
          value: ""
          help: 新浪微博主页链接

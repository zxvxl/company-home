services:
  # -------------------------------------------------------
  # MySQL 8.0（项目专用，独立于本地其他服务）
  # -------------------------------------------------------
  mysql:
    image: docker.1ms.run/library/mysql:8.0
    container_name: company-mysql
    restart: unless-stopped
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ry_cms
      MYSQL_USER: cms
      MYSQL_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - company-net

  # -------------------------------------------------------
  # Redis 7（项目专用）
  # -------------------------------------------------------
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    container_name: company-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --requirepass 123456 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - company-net

  # -------------------------------------------------------
  # CMS 后端（Spring Boot）
  # -------------------------------------------------------
  cms-server:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: company-cms
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - cms_uploads:/app/uploadPath
    environment:
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/ry_cms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: 123456
      SPRING_DATA_REDIS_DATABASE: 0
      RUOYI_SYSTEM_UPLOADPATH: /app/uploadPath
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - company-net

  # -------------------------------------------------------
  # Nuxt3 官网前台
  # -------------------------------------------------------
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: company-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://cms-server:8080
    depends_on:
      - cms-server
    networks:
      - company-net

volumes:
  mysql_data:
  redis_data:
  cms_uploads:

networks:
  company-net:
    driver: bridge

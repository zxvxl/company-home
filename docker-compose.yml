version: "3.8"

services:
  # -------------------------------------------------------
  # MySQL 8.0 数据库（外部独立服务）
  # -------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: company-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hongyuan2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-company_cms}
      MYSQL_USER: ${MYSQL_USER:-cms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cms_pass_2024}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    command: --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - company-net

  # -------------------------------------------------------
  # Redis 7 缓存服务
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: company-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass_2024} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - company-net

  # -------------------------------------------------------
  # 后端 API 服务（Spring Boot）
  # -------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: company-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-company_cms}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cms_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-cms_pass_2024}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - company-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  company-net:
    driver: bridge

version: "3.8"

services:
  halo:
    image: halohub/halo:2.20
    container_name: halo
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - halo_data:/root/.halo2
      - ./theme-engineering-company:/root/.halo2/themes/theme-engineering-company
    environment:
      - SPRING_SQL_INIT_PLATFORM=postgresql
      - SPRING_R2DBC_URL=r2dbc:pool:postgresql://database:5432/${POSTGRES_DB}
      - SPRING_R2DBC_USERNAME=${POSTGRES_USER}
      - SPRING_R2DBC_PASSWORD=${POSTGRES_PASSWORD}
      - HALO_EXTERNAL_URL=${HALO_EXTERNAL_URL}
      - HALO_SECURITY_INITIALIZER_SUPERADMINUSERNAME=${HALO_SECURITY_INITIALIZER_SUPERADMINUSERNAME}
      - HALO_SECURITY_INITIALIZER_SUPERADMINPASSWORD=${HALO_SECURITY_INITIALIZER_SUPERADMINPASSWORD}
    networks:
      - halo_network

  database:
    image: postgres:15
    container_name: halo_database
    restart: unless-stopped
    # 仅绑定 localhost，防止数据库端口暴露到外部网络（仅限开发环境使用）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - halo_network

volumes:
  halo_data:
    driver: local
  pg_data:
    driver: local

networks:
  halo_network:
    driver: bridge

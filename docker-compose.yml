services:
  # -------------------------------------------------------
  # CMS 后端（Spring Boot）
  # -------------------------------------------------------
  cms-server:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: company-cms
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - cms_uploads:/app/uploadPath
    environment:
      # 数据库配置
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://127.0.0.1:13306/xianyu_data?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: xianyu
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: xianyu@2026
      # Redis 配置
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: xianyu@2026
      SPRING_DATA_REDIS_DATABASE: 1
      # 文件上传路径
      RUOYI_SYSTEM_UPLOADPATH: /app/uploadPath
    # 使用 host 网络模式，直接访问宿主机的 MySQL 和 Redis
    network_mode: host

  # -------------------------------------------------------
  # Nuxt3 官网前台
  # -------------------------------------------------------
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: company-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:8080
    network_mode: host

volumes:
  cms_uploads:
    driver: local

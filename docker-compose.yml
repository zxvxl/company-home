version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: company-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hongyuan2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry_cms}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./cms/ruoyi-admin/src/main/resources/db/migration/V1.0.0__init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower-case-table-names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - company-net

  redis:
    image: redis:7-alpine
    container_name: company-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass_2024} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - company-net

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: company-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://cms-server:8080
    networks:
      - company-net

  nginx:
    image: nginx:alpine
    container_name: company-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - website
    networks:
      - company-net

  # CMS 后端需要先 mvn package 打包后启动
  # 取消注释即可使用
  # cms-server:
  #   image: openjdk:17-slim
  #   container_name: cms-server
  #   restart: unless-stopped
  #   working_dir: /app
  #   command: java -jar ruoyi-admin.jar --spring.profiles.active=prod
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./cms/ruoyi-admin/target/ruoyi-admin.jar:/app/ruoyi-admin.jar
  #     - ./uploads:/app/uploadPath
  #   environment:
  #     SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ry_cms}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
  #     SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
  #     SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hongyuan2024}
  #     SPRING_DATA_REDIS_HOST: redis
  #     SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_2024}
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - company-net

volumes:
  mysql_data:
  redis_data:

networks:
  company-net:
    driver: bridge
